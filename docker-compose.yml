services:
  db:
    image: pgvector/pgvector:pg16
    container_name: neurorag-db
    environment:
      POSTGRES_USER: neurorag
      POSTGRES_PASSWORD: neurorag
      POSTGRES_DB: neurorag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U neurorag" ]   # wait until Postgres actually accepts connections
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
